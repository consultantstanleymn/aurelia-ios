<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 18 14" shape-rendering="crispEdges" role="img" aria-label="Aurelia crab">
  <defs>
    <!-- Gold that lightens toward the top of each mass, so the flat pixel silhouette reads as a
         rounded, lit shell rather than a block of colour. -->
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="34%" stop-color="#F0C94A"/>
      <stop offset="72%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#9A6B08"/>
    </linearGradient>
    <!-- The claws sit higher than the body and catch more light, so they take a warmer ramp. -->
    <linearGradient id="claw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBE8"/>
      <stop offset="40%" stop-color="#F7D470"/>
      <stop offset="100%" stop-color="#C89010"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBC65A"/>
      <stop offset="100%" stop-color="#A87610"/>
    </linearGradient>
  </defs>

  <!-- legs, behind everything -->
  <g fill="url(#leg)">
    <rect x="3" y="10" width="1" height="1"/>
    <rect x="5" y="10" width="1" height="1"/>
    <rect x="10" y="10" width="1" height="1"/>
    <rect x="12" y="10" width="1" height="1"/>
    <rect x="2" y="11" width="1" height="1"/>
    <rect x="13" y="11" width="1" height="1"/>
  </g>

  <!-- body -->
  <g fill="url(#shell)">
    <rect x="5" y="4" width="6" height="1"/>
    <rect x="4" y="5" width="8" height="1"/>
    <rect x="3" y="6" width="10" height="3"/>
    <rect x="4" y="9" width="8" height="1"/>
  </g>

  <!-- claws -->
  <g fill="url(#claw)">
    <rect x="2" y="1" width="2" height="1"/>
    <rect x="12" y="1" width="2" height="1"/>
    <rect x="1" y="2" width="4" height="2"/>
    <rect x="11" y="2" width="4" height="2"/>
    <rect x="2" y="4" width="2" height="1"/>
    <rect x="12" y="4" width="2" height="1"/>
  </g>

  <!-- gloss: a white specular band along the top edge of the shell and the claws, inset so the
       highlight never touches the silhouette and reads as a reflection on a curved surface. -->
  <g fill="#FFFFFF" opacity="0.92">
    <rect x="6" y="5" width="4" height="1"/>
    <rect x="4" y="6" width="3" height="1"/>
    <rect x="2" y="2" width="2" height="1"/>
    <rect x="12" y="2" width="2" height="1"/>
  </g>
  <!-- a softer second band, lower opacity, to fake the falloff of light down a curved shell -->
  <g fill="#FFFFFF" opacity="0.34">
    <rect x="5" y="4" width="4" height="1"/>
    <rect x="4" y="7" width="6" height="1"/>
    <rect x="1" y="3" width="3" height="1"/>
    <rect x="12" y="3" width="3" height="1"/>
  </g>
</svg>
